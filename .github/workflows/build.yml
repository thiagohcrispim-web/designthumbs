# Compila o DesignThumbs a cada envio e publica o instalador como artefato.
# Base para a assinatura gratuita da SignPath Foundation (builds automatizados e verificáveis).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar MinGW
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix

      - uses: actions/cache@v4
        with:
          path: build/engine/inkscape.7z
          key: inkscape-1.4.2-757e0358512630e6

      - name: Compilar
        run: ./build.sh

      - name: Publicar artefato
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: DesignThumbs-Setup
          path: DesignThumbs-Setup.exe
          if-no-files-found: error

