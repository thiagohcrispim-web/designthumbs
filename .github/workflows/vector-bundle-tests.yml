name: Bundled vector engine tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile bundle installation tests
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /std:c++17 /utf-8 /EHsc /W4 /DUNICODE /D_UNICODE tests\vector_bundle_tests.cpp /Fe:build\bundle-tests.exe /link shlwapi.lib ole32.lib xmllite.lib advapi32.lib bcrypt.lib urlmon.lib winhttp.lib
      - name: Test download, installation, SVG/EPS conversion, reinstall and uninstall
        shell: cmd
        run: build\bundle-tests.exe
