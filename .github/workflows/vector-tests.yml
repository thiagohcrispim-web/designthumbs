name: Vector conversion tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile vector audit tests
        shell: cmd
        run: cl /nologo /std:c++17 /utf-8 /EHsc /W4 /DUNICODE /D_UNICODE tests\vector_tests.cpp /Fe:vector_tests.exe /link shlwapi.lib ole32.lib xmllite.lib
      - name: Run vector audit tests
        shell: cmd
        run: vector_tests.exe
