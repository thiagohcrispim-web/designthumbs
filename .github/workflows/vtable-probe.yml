# Temporário: lê do compilador da Microsoft a posição dos métodos de ID2D1SvgElement.
name: SVG vtable probe
on:
  push:
    paths: ['tests/probe/**', '.github/workflows/vtable-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - shell: pwsh
        run: |
          cl /nologo /c /O1 /FAs /Fa:probe.asm tests\probe\svg_vtable.cpp | Out-Null
          Get-Content probe.asm | Select-String -Pattern '^\?P_\w+@@.* PROC|call\s+QWORD PTR \[|jmp\s+QWORD PTR \[|rex_jmp' | ForEach-Object { $_.Line.Trim() }
